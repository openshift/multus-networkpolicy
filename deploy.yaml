---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: multi-networkpolicy-nftables
rules:
  - apiGroups: ["k8s.cni.cncf.io"]
    resources:
      - '*'
    verbs:
      - '*'
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/status
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: multi-networkpolicy-nftables
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multi-networkpolicy-nftables
subjects:
  - kind: ServiceAccount
    name: multi-networkpolicy-nftables
    namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multi-networkpolicy-nftables
  namespace: kube-system
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: multi-networkpolicy-custom-v4-rules
  namespace: kube-system
  labels:
    tier: node
    app: multi-networkpolicy
data:
  custom-v4-rules.txt: |
    # Add custom IPv4 rules here if needed
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: multi-networkpolicy-custom-v6-rules
  namespace: kube-system
  labels:
    tier: node
    app: multi-networkpolicy
data:
  custom-v6-rules.txt: |
    # Add custom IPv6 rules here if needed
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: multi-networkpolicy-nftables
  namespace: kube-system
  labels:
    app: multi-networkpolicy-nftables
spec:
  selector:
    matchLabels:
      name: multi-networkpolicy-nftables
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: multi-networkpolicy-nftables
    spec:
      hostNetwork: true
      serviceAccountName: multi-networkpolicy-nftables
      containers:
        - name: multi-networkpolicy-nftables
          image: ghcr.io/k8snetworkplumbingwg/multi-networkpolicy-nftables:v0.1.0
          imagePullPolicy: Always
          command:
            - /multi-networkpolicy-nftables
          args:
            - "--zap-log-level=2"
            - "--container-runtime-endpoint=/run/crio/crio.sock"
            - "--network-plugins=macvlan,ipvlan"
            - "--host-prefix=/host"
            # accept all icmp/icmpv6 types
            - "--accept-icmp"
            - "--accept-icmpv6"
            # custom rules
            - "--custom-v4-ingress-rule-file=/etc/multi-networkpolicy/rules/custom-v4-rules.txt"
            - "--custom-v4-egress-rule-file=/etc/multi-networkpolicy/rules/custom-v4-rules.txt"
            - "--custom-v6-ingress-rule-file=/etc/multi-networkpolicy/rules/custom-v6-rules.txt"
            - "--custom-v6-egress-rule-file=/etc/multi-networkpolicy/rules/custom-v6-rules.txt"
          resources:
            requests:
              cpu: "100m"
              memory: "80Mi"
            limits:
              cpu: "100m"
              memory: "150Mi"
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN", "NET_ADMIN"]
          volumeMounts:
            - name: host
              mountPath: /host
            - name: multi-networkpolicy-custom-rules
              mountPath: /etc/multi-networkpolicy/rules
              readOnly: true
      volumes:
        - name: host
          hostPath:
            path: /
        - name: multi-networkpolicy-custom-rules
          projected:
            sources:
              - configMap:
                  name: multi-networkpolicy-custom-v4-rules
              - configMap:
                  name: multi-networkpolicy-custom-v6-rules
